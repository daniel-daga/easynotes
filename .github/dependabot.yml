# Update pull requests for the three things this repository depends on from
# outside. Weekly and grouped, so that they
# arrive as a few pull requests a week that CI has already run on, rather than
# one per crate. Security updates are not held to this schedule: GitHub opens
# those as soon as an advisory lands, when Dependabot security updates are on
# in the repository settings.
#
# Not covered: `third_party/flutter_rust_bridge`, a patched copy that moves
# with the bridge codegen and the Dart package together (third_party/README.md).
# The `Advisories` workflow checks its upstream version instead.
#
# Every action in `.github/workflows/` is pinned to a commit SHA, with the
# release it came from in a trailing comment (`@<sha> # v4.4.0`). A moved or
# re-pointed tag then cannot change what runs, least of all in `release.yml`,
# which holds the signing key. Dependabot reads that comment and moves the SHA
# and the comment together; pin a new action the same way. The toolchain
# action has no releases, only a `v1` tag that follows its default branch, and
# picks the Rust channel from its `toolchain` input rather than from the ref.
# Dependabot version update PRs are temporarily paused. Set each
# open-pull-requests-limit back above zero to resume them. Security updates
# are managed separately in the repository settings.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Moves with the vendored crate and the codegen, never on its own.
      - dependency-name: flutter_rust_bridge

  - package-ecosystem: pub
    directory: /app
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      dart:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: flutter_rust_bridge

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
