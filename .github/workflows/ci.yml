name: CI

# Only on `main`, and by hand. A pull request does not run this: the three jobs
# below are half an hour of runners between them, and the justfile recipes they
# wrap are the ones a contributor runs locally before pushing, so the pull
# request was paying for a second opinion on a claim it had already made.
# `workflow_dispatch` is the escape hatch for asking anyway, on any branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The core, the relay, and the tests that need neither Flutter nor a browser.
  # This is the job that has to stay fast: it is what a contributor waits on.
  rust:
    name: Rust
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easynotes
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` here rather than in RUSTFLAGS: as an environment variable it
      # applies to every dependency too, and one upstream deprecation would fail
      # a build that has nothing wrong with it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The code a browser runs, linted for the browser's target with the std
      # calls that compile there and then panic forbidden — the note watcher's
      # `thread::spawn` took the web app down on its first frame (ADR 0002).
      # Here it fails in a minute instead of in the web job's browser.
      - name: Clippy for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          export CLIPPY_CONF_DIR="$GITHUB_WORKSPACE/tools/wasm-lint"
          cargo clippy --target wasm32-unknown-unknown -p easynotes-core --lib \
            --no-default-features --features automerge-backend,yrs-backend,web-store,sync-web -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p rust_lib_easynotes --lib -- -D warnings

      # With DATABASE_URL set, the Postgres tests run instead of skipping. They
      # are the only cover for the concurrency in the relay's sequence
      # allocation, which an in-memory store cannot exercise.
      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/easynotes
        run: cargo test --workspace

      # The core must stay free of anything native, or the web build dies later
      # and further from the cause. Both backends, because D1 is reversible.
      #
      # The bridge crate too, since the sync engine made it the one crate whose
      # code differs per target: this catches a broken `#[cfg]` split here in
      # half a minute instead of ten minutes into the web job. It is also what
      # keeps SQLite's C out of a browser bundle — the bridge names the core's
      # features per target (ADR 0005), and nothing but this step proves it.
      - name: Build for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p easynotes-core --target wasm32-unknown-unknown \
            --no-default-features --features yrs-backend
          cargo build -p easynotes-core --target wasm32-unknown-unknown \
            --no-default-features --features automerge-backend
          cargo build -p rust_lib_easynotes --target wasm32-unknown-unknown

  # The Flutter app: widget tests against a fake core, tests that drive the real
  # core across the bridge, and the demo run from the app's own API through a
  # relay process.
  flutter:
    name: Flutter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          # libsecret is what flutter_secure_storage keeps the master key in on
          # Linux; without the headers the desktop build does not link.
          sudo apt-get install -y libgtk-3-dev clang cmake ninja-build pkg-config \
            liblzma-dev libsecret-1-dev

      - run: flutter pub get
        working-directory: app

      - run: flutter analyze
        working-directory: app

      # Built first: the bridge tests skip without the library and the relay
      # tests skip without the binary, and a skipped test that looks green is
      # worse than no test.
      - name: Build the native library and the relay
        run: cargo build -p rust_lib_easynotes -p easynotes-relay

      - name: Test
        working-directory: app
        env:
          EASYNOTES_NATIVE_LIB: ${{ github.workspace }}/target/debug/librust_lib_easynotes.so
          EASYNOTES_RELAY_BIN: ${{ github.workspace }}/target/debug/easynotes-relay
        run: flutter test

      - name: Build for Linux desktop
        working-directory: app
        run: flutter build linux --release

  # The web build, kept separate because it needs a nightly toolchain and
  # `-Z build-std` and so is both slower and more fragile than the rest.
  # ADR 0002 records why it is worth having in CI anyway.
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install the web toolchain
        run: |
          cargo install wasm-pack --locked
          # Pre-installed so that wasm-pack does not build it itself with the
          # WebAssembly RUSTFLAGS still set, which cannot link for the host.
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          cargo install flutter_rust_bridge_codegen --version ^2 --locked

      - run: flutter pub get
        working-directory: app

      # No `--wasm-pack-rustflags`: an override replaces the bridge's threading
      # flags rather than adding to them, and the core that comes out links and
      # then fails in the browser (ADR 0002). The step after this one is the
      # build-time half of that failure.
      - name: Build the core for the web
        working-directory: app
        run: flutter_rust_bridge_codegen build-web --release

      - name: Check the core came out threaded
        run: |
          if ! grep -q 'shared:true' app/web/pkg/rust_lib_easynotes.js; then
            echo "::error::the web core creates unshared memory: the threaded-WebAssembly RUSTFLAGS were lost (ADR 0002)"
            exit 1
          fi

      - name: Build the web app
        working-directory: app
        run: flutter build web --release

      # The two failures the web build has produced so far — a thread panic and
      # a memory-cloning error — both compiled cleanly and only appeared when a
      # browser ran the code (ADR 0002). Each has a build-time check above now,
      # and this stays as the backstop for the next one. Since the web store
      # landed there is a third thing only a browser can answer: whether IndexedDB was opened and
      # whether a reloaded tab reads back what the first one wrote.
      - name: Run the web build in a browser
        working-directory: tools/web-smoke
        run: |
          # No browser download: the runner has Chrome, and `playwright-core`
          # uses it rather than fetching a hundred megabytes for six assertions.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-fund --no-audit playwright-core
          python3 serve.py "$GITHUB_WORKSPACE/app/build/web" 8099 &
          until curl -sfo /dev/null http://127.0.0.1:8099/; do sleep 0.2; done
          node smoke.mjs http://127.0.0.1:8099/

      # And whether it can reach a relay. The browser transport is the one part
      # of syncing no `cargo test` can run — it is the tab's own WebSocket and
      # `fetch` — so this is the only thing that covers the join between the
      # engine and the browser.
      - name: Sync from a browser to a real relay
        working-directory: tools/web-smoke
        run: |
          cargo build -p easynotes-relay
          "$GITHUB_WORKSPACE/target/debug/easynotes-relay" &
          # A port of its own: the step above leaves its server running, and a
          # second one on 8099 would fail to bind and then quietly be served by
          # the first, which is a test passing for the wrong reason.
          python3 serve.py "$GITHUB_WORKSPACE/app/build/web" 8098 &
          until curl -sfo /dev/null http://127.0.0.1:8080/v1/health; do sleep 0.2; done
          until curl -sfo /dev/null http://127.0.0.1:8098/; do sleep 0.2; done
          node sync.mjs http://127.0.0.1:8098/

      # And whether two of them agree. Two browser contexts, as far apart as two
      # people's phones, share a list through an invite link and the real
      # screens, then edit it online and offline. Every other convergence test
      # has a headless core on one side. Reuses the relay and the server the
      # step above left running.
      - name: Two tabs edit one list and converge
        working-directory: tools/web-smoke
        run: node converge.mjs http://127.0.0.1:8098/

      # And what a deletion leaves when the browser refuses a write partway
      # through it. The refusal is IndexedDB's own, a failed request that aborts
      # the transaction, which no `flutter test` can make. No relay is needed;
      # the server from the first browser step is still on 8099.
      - name: A deletion survives a refused write
        working-directory: tools/web-smoke
        run: node storage-failure.mjs http://127.0.0.1:8099/

      # A size that grows quietly is a size nobody notices until launch.
      - name: Report the bundle size
        working-directory: app
        run: |
          wasm=web/pkg/rust_lib_easynotes_bg.wasm
          echo "### Web bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Raw | Gzipped |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rust core (wasm) | $(numfmt --to=iec < <(stat -c%s $wasm)) | $(gzip -9 -c $wasm | wc -c | numfmt --to=iec) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| main.dart.js | $(numfmt --to=iec < <(stat -c%s build/web/main.dart.js)) | $(gzip -9 -c build/web/main.dart.js | wc -c | numfmt --to=iec) |" >> "$GITHUB_STEP_SUMMARY"
