name: CI

# On `main`, on every pull request, and by hand. Pull requests used not to run
# it, on the grounds that a contributor had already run the justfile recipes it
# wraps; that holds for one maintainer and not for a change from anyone else,
# which is what a public project gets (production readiness review, F7).
# `workflow_dispatch` is still there for asking on any branch.
#
# Kept to lint and tests. Building the app itself — the APK, the Linux desktop
# bundle, the web build and its browser checks — is most of an hour of runners
# and lives in `app-builds.yml`, which runs only when asked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # So that `release.yml` can require the same lint and tests before it builds.
  workflow_call:

# A pull request that is pushed to again needs only its newest run. `main` keeps
# every run, so that each commit on it has a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The core, the relay, and the tests that need neither Flutter nor a browser.
  # This is the job that has to stay fast: it is what a contributor waits on.
  rust:
    name: Rust
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easynotes
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` here rather than in RUSTFLAGS: as an environment variable it
      # applies to every dependency too, and one upstream deprecation would fail
      # a build that has nothing wrong with it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The code a browser runs, linted for the browser's target with the std
      # calls that compile there and then panic forbidden — the note watcher's
      # `thread::spawn` took the web app down on its first frame (ADR 0002).
      # Here it fails in a minute instead of in the web job's browser.
      - name: Clippy for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          export CLIPPY_CONF_DIR="$GITHUB_WORKSPACE/tools/wasm-lint"
          cargo clippy --target wasm32-unknown-unknown -p easynotes-core --lib \
            --no-default-features --features automerge-backend,yrs-backend,web-store,sync-web -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p rust_lib_easynotes --lib -- -D warnings

      # With DATABASE_URL set, the Postgres tests run instead of skipping. They
      # are the only cover for the concurrency in the relay's sequence
      # allocation, which an in-memory store cannot exercise.
      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/easynotes
        run: cargo test --workspace

      # The core must stay free of anything native, or the web build dies later
      # and further from the cause. Both backends, because D1 is reversible.
      #
      # The bridge crate too, since the sync engine made it the one crate whose
      # code differs per target: this catches a broken `#[cfg]` split here in
      # half a minute instead of ten minutes into the web job. It is also what
      # keeps SQLite's C out of a browser bundle — the bridge names the core's
      # features per target (ADR 0005), and nothing but this step proves it.
      - name: Build for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p easynotes-core --target wasm32-unknown-unknown \
            --no-default-features --features yrs-backend
          cargo build -p easynotes-core --target wasm32-unknown-unknown \
            --no-default-features --features automerge-backend
          cargo build -p rust_lib_easynotes --target wasm32-unknown-unknown

  # The Flutter app: widget tests against a fake core, tests that drive the real
  # core across the bridge, and the demo run from the app's own API through a
  # relay process. Tests only; the desktop build is in `app-builds.yml`.
  flutter:
    name: Flutter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          # libsecret is what flutter_secure_storage keeps the master key in on
          # Linux; without the headers the desktop build does not link.
          sudo apt-get install -y libgtk-3-dev clang cmake ninja-build pkg-config \
            liblzma-dev libsecret-1-dev

      - run: flutter pub get
        working-directory: app

      - run: flutter analyze
        working-directory: app

      # Built first: the bridge tests skip without the library and the relay
      # tests skip without the binary, and a skipped test that looks green is
      # worse than no test.
      - name: Build the native library and the relay
        run: cargo build -p rust_lib_easynotes -p easynotes-relay

      - name: Test
        working-directory: app
        env:
          EASYNOTES_NATIVE_LIB: ${{ github.workspace }}/target/debug/librust_lib_easynotes.so
          EASYNOTES_RELAY_BIN: ${{ github.workspace }}/target/debug/easynotes-relay
        run: flutter test
