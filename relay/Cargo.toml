[package]
name = "easynotes-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dumb WebSocket relay: stores and forwards ciphertext only."

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
easynotes-core = { version = "0.1.0", path = "../core", default-features = false }
ed25519-dalek = "2.2.0"
futures-util = "0.3.34"
serde.workspace = true
serde_json.workspace = true
# Invite tokens and owner secrets are kept as hashes. Already in the tree under
# the core.
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
# Only the CORS layer. Hand-rolling preflight handling is a well-known way to
# write a subtly wrong one, and everything under it is already in the tree
# behind axum.
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# The tests drive the relay with real cores over a real socket, so they need the
# full core including its sync client.
easynotes-core = { path = "../core", features = ["sync-native", "test-support"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tempfile = "3"
# The compatibility fixtures leave each SQLite store as one self-contained file
# (`tests/compat.rs`). Already in the tree under the core.
rusqlite = { version = "0.40.2", features = ["bundled"] }
