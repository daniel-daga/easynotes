[package]
name = "easynotes-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Crypto, CRDT, op log and sync client for EasyNotes. No UI, no platform policy."

[lib]
name = "easynotes_core"

[dependencies]
automerge = { version = "0.7", optional = true }
base64 = "0.23.1"
# The recovery phrase. English wordlist only — the phrase is this account's root
# secret and a person who wrote it down in one language reads it back in the
# same one, so the other nine lists are 20 KB of bundle nobody reaches.
bip39 = { version = "3", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2.0"
futures-util = { version = "0.3.34", optional = true }
getrandom = "0.3.4"
hex = "0.4.3"
# Key derivation for the account root. Both were already in the tree under
# `ed25519-dalek`, so naming them here adds no crate to any of the six targets.
hkdf = "0.13.0"
# The relay access proof (ADR 0028). Already in the tree under `hkdf`.
hmac = "0.13.0"
rand = "0.10.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# `bundled` compiles the SQLite amalgamation, so there is no system library to
# find and no version to be surprised by on any of the six targets.
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"], optional = true }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# Pinned: yrs 0.27.0 and later publish a manifest declaring edition 2018 while the
# source uses `if let` guards, which are edition-2024-only. They do not compile on
# stable Rust at all. See docs/adr/0001-crdt.md.
yrs = { version = "=0.26.0", optional = true, features = ["sync"] }
zeroize = "1.8.2"

[features]
default = ["automerge-backend", "yrs-backend", "file-store", "sqlite-store", "web-store"]
# The CRDT backends. Decision D1 picks one; both stay behind the `NoteDoc` trait
# until it is made, and the benchmark needs both present at once.
automerge-backend = ["dep:automerge"]
yrs-backend = ["dep:yrs"]
# Native filesystem op log. Off for wasm32 and for the relay, which needs only
# the wire format.
file-store = []
# The real local store: SQLite for the log and the wrapped keys. Native only —
# a browser has no filesystem, and the web store is IndexedDB behind the same
# `OpStore` trait. On by default so `cargo test` cannot quietly skip it.
sqlite-store = ["dep:rusqlite", "file-store"]
# The store a browser gets: reads from memory, writes handed to whatever can
# reach IndexedDB. Plain Rust with no browser in it — the part that talks to one
# is in the bridge crate — so it is on by default and `cargo test` holds it to
# the same conformance suite as the other two.
web-store = []
# The share blob: a note's ID and key in one string, handed across by hand. It
# was Slice 1's way to share, and the app no longer has it — a link that *is*
# the key is what invites and access packages replaced (ADR 0015, ADR 0023).
# What is left is test scaffolding: the quickest way to put one note on two
# devices in a test with no relay. Off by default so no shipped build carries
# it; this crate's own tests and the relay's switch it on.
test-support = []
# The WebSocket sync client. Native only: the web build talks to the relay through
# the browser's own WebSocket, which is M4 work and a different transport behind
# the same `SyncClient` shape.
sync-native = ["dep:tokio-tungstenite", "dep:reqwest", "dep:futures-util", "tokio/rt", "tokio/macros", "tokio/time"]
# The same engine over the browser's own WebSocket and `fetch`. Only the
# transport differs — see `sync::wire` for everything the two share — and the
# dependencies it needs exist only for wasm32, so the feature is inert
# elsewhere and the module behind it is `cfg`-ed on the target as well.
sync-web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:futures-util", "tokio/macros", "tokio/time"]

[dev-dependencies]
# Lets this crate's integration tests use `test-support` without every
# `cargo test` having to remember the flag.
easynotes-core = { path = ".", features = ["test-support"] }
# The store tests reach past the trait to check what is actually in the file.
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
# The browser's media store is asynchronous; its tests run it on a runtime.
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

# WebAssembly needs to be told where randomness comes from. Two versions of
# `getrandom` are in the tree — 0.3 directly, and 0.2 via RustCrypto's `rand_core`
# — and each needs its own opt-in for the browser. The feature is the whole of
# it: 0.3.4 is the first 0.3 that no longer also wants a `--cfg getrandom_backend`
# in RUSTFLAGS, and that flag was the only reason the web build overrode
# flutter_rust_bridge's own, which is how it lost the threading ones (ADR 0002).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
# The web transport (`sync-web`). Pinned to the versions flutter_rust_bridge
# already brings, so enabling this adds no crate to the tree that the web build
# did not have.
wasm-bindgen = { version = "0.2.128", optional = true }
wasm-bindgen-futures = { version = "0.4.78", optional = true }
js-sys = { version = "0.3.105", optional = true }
web-sys = { version = "0.3.105", optional = true, features = [
    "WebSocket",
    "MessageEvent",
    "Request",
    "RequestInit",
    "AbortController",
    "AbortSignal",
    "Response",
    "Headers",
    "Window",
    "WorkerGlobalScope",
    # The browser's media store (`attachment::idb`).
    "DomException",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
] }
