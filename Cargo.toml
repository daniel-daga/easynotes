[workspace]
resolver = "2"
members = ["core", "relay", "tools/wasm-size", "tools/web-bench", "app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.82"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
