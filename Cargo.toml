[workspace]
resolver = "2"
members = ["core", "relay", "tools/wasm-size", "tools/web-bench", "tools/web-media", "app/rust"]
# Vendored with a patch, not ours to lint, test or format: see third_party/README.md.
exclude = ["third_party"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.82"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"

# flutter_rust_bridge 2.13.0 with pool lock and cached-Arc drop ordering fixes.
# Its lock does not wait on the page's main thread. third_party/README.md has the
# diff and why, and what to do on an upgrade.
[patch.crates-io]
flutter_rust_bridge = { path = "third_party/flutter_rust_bridge" }
