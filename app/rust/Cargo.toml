[package]
name = "rust_lib_easynotes"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# Only the synchronisation primitives here; the runtime that drives the sync
# engine is native-only and is pulled in below.
tokio = { version = "1", default-features = false, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.23.1"

# The native relay client needs a reactor and a browser tab cannot have one, so
# the web build gets `sync-web` instead — the same engine over the browser's own
# WebSocket. `src/relay.rs` carries the one type whose implementation differs,
# which is now only about what drives the engine rather than whether there is
# one.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
easynotes-core = { path = "../../core", features = ["sync-native"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net"] }

# The browser gets the CRDT, the crypto and the web store, and nothing that
# touches a disk: the SQLite store compiles C, which has no business in a
# WebAssembly bundle, and the filesystem store would be a directory a tab does
# not have. `web-store` is the one a browser gets instead — it holds no browser
# API itself, only the rules; see `crate::api::notes` for where the two meet.
[target.'cfg(target_arch = "wasm32")'.dependencies]
easynotes-core = { path = "../../core", default-features = false, features = ["automerge-backend", "yrs-backend", "web-store", "sync-web"] }
# The engine needs somewhere to run, and in a tab that is the page's own event
# loop rather than a runtime we start.
wasm-bindgen-futures = "0.4.78"
# The page's clock, for how long an invite has left. `SystemTime` panics in a
# browser. Already in the tree under the bridge.
js-sys = "0.3.105"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
