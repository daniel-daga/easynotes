# One network with a known subnet, so that the relay can be told which peer is
# DSM's reverse proxy. DSM connects to 127.0.0.1:18080 on the NAS, and Docker
# hands that connection to the relay from this network's gateway, so every
# client arrives from one address. RELAY_TRUSTED_PROXIES below lets the relay
# read the real client from the X-Forwarded-For header DSM adds, instead of
# rate-limiting every device as one. Nothing outside the NAS can connect from
# this range: the only published port is bound to 127.0.0.1.
networks:
  default:
    ipam:
      config:
        - subnet: ${RELAY_NETWORK:-172.30.87.0/24}

services:
  db:
    container_name: easynotes-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: easynotes
      POSTGRES_USER: easynotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${NAS_DATA_DIR:-/volume1/docker/easynotes-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easynotes -d easynotes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  relay:
    container_name: easynotes-relay
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The relay's own readiness: up, and its database answering. The runtime
    # image has no curl, so the binary asks itself.
    healthcheck:
      test: ["CMD", "/usr/local/bin/easynotes-relay", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # On a stop the relay closes its sync sockets and lets requests in flight
    # finish for up to RELAY_DRAIN_SECONDS (8 by default). This leaves it room
    # to do that before Docker kills it.
    stop_grace_period: 15s
    environment:
      RELAY_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://easynotes:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/easynotes
      RELAY_ALLOWED_ORIGINS: ${RELAY_ALLOWED_ORIGINS:?Set RELAY_ALLOWED_ORIGINS in .env}
      RELAY_TOKEN_SIGNING_KEY: ${RELAY_TOKEN_SIGNING_KEY:?Set RELAY_TOKEN_SIGNING_KEY in .env}
      RELAY_STORAGE_CEILING: ${RELAY_STORAGE_CEILING:-}
      RELAY_MEDIA_DIR: /var/lib/easynotes-media
      RELAY_MEDIA_PER_NOTE: ${RELAY_MEDIA_PER_NOTE:-}
      RELAY_MEDIA_CEILING: ${RELAY_MEDIA_CEILING:-}
      RELAY_TRUSTED_PROXIES: ${RELAY_NETWORK:-172.30.87.0/24}
      # Prometheus metrics, on a port of their own that the reverse proxy does
      # not serve. See deploy/synology/README.md, "Monitoring".
      RELAY_METRICS_ADDR: 0.0.0.0:9090
      RUST_LOG: easynotes_relay=info
    volumes:
      # Attachment bytes (ADR 0027). Must be writable by uid 10001, the user
      # the relay runs as; see deploy/synology/README.md.
      - ${NAS_DATA_DIR:-/volume1/docker/easynotes-data}/media:/var/lib/easynotes-media
    ports:
      # DSM's reverse proxy connects on the NAS itself. Do not expose this port
      # directly on the LAN or the Internet; publish HTTPS through DSM instead.
      - "127.0.0.1:18080:8080"
      # Metrics, for a Prometheus on the NAS itself. Keep this one off DSM's
      # reverse proxy too: it says how much the relay holds, which is nobody
      # else's business.
      - "127.0.0.1:${RELAY_METRICS_PORT:-19090}:9090"
